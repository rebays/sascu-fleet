<title>SASCU Email Templates — Preview</title>
<style>
  :root {
    --ink: #14213d;
    --paper: #f1f4f9;
    --card: #ffffff;
    --line: #dbe2ee;
    --muted: #5b6b85;
    --accent: #063587;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ecf7; --paper: #0d1420; --card: #131c2b; --line: #263248; --muted: #8b9ab3; --accent: #7fa1e6; }
  }
  :root[data-theme='dark'] { --ink: #e7ecf7; --paper: #0d1420; --card: #131c2b; --line: #263248; --muted: #8b9ab3; --accent: #7fa1e6; }
  :root[data-theme='light'] { --ink: #14213d; --paper: #f1f4f9; --card: #ffffff; --line: #dbe2ee; --muted: #5b6b85; --accent: #063587; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  header { margin-bottom: 36px; }
  header h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; max-width: 62ch; line-height: 1.5; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 28px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .card-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .card-head span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .frame-wrap { overflow-x: auto; background: #eef1f6; }
  iframe { display: block; width: 100%; height: 620px; border: 0; background: #eef1f6; }
</style>
